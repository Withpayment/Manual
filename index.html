<script>
function LENS_PARSE(t,f,VANS,FX,W){
 const L=t.replace(/\r/g,"").split("\n"),H={};let cur=null;const items=[];
 const parseItem=s=>{const a=s.indexOf(" ※ ");let note="",h=s;if(a>=0){note=s.slice(a+3).trim();h=s.slice(0,a)}const b=h.indexOf(" = ");let n=b>=0?h.slice(0,b):h,v=b>=0?h.slice(b+3):"";n=n.trim();v=v.trim();if(v.includes(">"))v=v.split(">").map(x=>x.trim()).join(">");else if(v.includes("|"))v=v.split("|").map(x=>x.trim()).join("|");return note?[n,v,note]:[n,v]};
 const blocks=[];
 for(let i=0;i<L.length;i++){const s=L[i].trim();if(!s)continue;
  if(s.startsWith("## ")){cur={title:s.slice(3).trim(),items:[],meta:{}};blocks.push(cur);continue}
  if(s.startsWith("# "))continue;
  if(!cur){const m=s.match(/^(종류|VAN|장비|모델)\s*:\s*(.*)$/);if(m)H[m[1]]=m[2].trim();else W.push(f+" "+(i+1)+"줄: 읽을 수 없는 줄 → "+s.slice(0,30));continue}
  if(s.startsWith("- ")){cur.items.push(parseItem(s.slice(2)));continue}
  const m=s.match(/^(원인|키워드|장비|장비2|모델|표시|VAN)\s*:\s*(.*)$/);
  if(m){cur.meta[m[1]]=m[2].trim();continue}
  W.push(f+" "+(i+1)+"줄: 읽을 수 없는 줄 → "+s.slice(0,30));
 }
 const fix=H["종류"]==="문제해결";
 for(const b of blocks){
  if(fix){
   const v=b.meta.VAN||H.VAN,d=b.meta["장비"]||H["장비"];
   if(!v||!d){W.push(f+": '"+b.title.slice(0,20)+"' 항목에 VAN 또는 장비가 없습니다");continue}
   if(!b.items.length)W.push(f+": '"+b.title.slice(0,20)+"' 항목에 내용(- 줄)이 없습니다");
   const e={v,d,m:b.meta["모델"]||H["모델"]||"",t:b.title,k:b.meta["키워드"]||"",c:b.meta["원인"]||"",i:b.items};
   if(b.meta["장비2"])e.d2=b.meta["장비2"];if(b.meta["표시"])e.tag=b.meta["표시"];
   FX.push(e);
  }else{
   const v=H.VAN,d=H["장비"];
   if(!v||!d){W.push(f+": 파일 맨 위에 VAN, 장비 줄이 필요합니다");break}
   if(!b.items.length){W.push(f+": '"+b.title.slice(0,20)+"' 묶음에 내용(- 줄)이 없습니다");continue}
   (VANS[v]=VANS[v]||{});(VANS[v][d]=VANS[v][d]||[]).push({p:b.title,i:b.items});
  }
 }
}
async function LENS_LOAD(){
 const W=[],VANS={KICC:{POS:[],"단말기":[],"키오스크":[]},KPN:{POS:[],"단말기":[],"키오스크":[],"테이블오더":[]},KIS:{POS:[],"단말기":[]}},FX=[];
 const get=async p=>{const r=await fetch(p,{cache:"no-cache"});if(!r.ok)throw new Error(p+" ("+r.status+")");return r.text()};
 let files=[];
 try{const l=await get("data/list.md");files=[...l.matchAll(/^\s*[-*]\s+(\S+\.md)\s*$/gm)].map(m=>m[1])}
 catch(e){document.getElementById("tree").innerHTML='<div class="card"><div class="nm">데이터를 불러오지 못했습니다</div><div class="path">이 페이지는 웹 주소(GitHub Pages)로 열어야 하고, data 폴더가 index.html과 같은 위치에 있어야 합니다. 파일을 컴퓨터에서 직접 열면 데이터를 읽을 수 없습니다.</div></div>';throw e}
 for(const f of files){try{LENS_PARSE(await get("data/"+f),f,VANS,FX,W)}catch(e){W.push(f+": 파일을 읽지 못했습니다 ("+e.message+")")}}
 if(W.length){const w=document.getElementById("warn");w.style.display="";w.innerHTML="<summary>⚠ 데이터 확인 필요 "+W.length+"건 (눌러서 보기)</summary>"+W.map(x=>'<div class="path">'+x.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+"</div>").join("")}
 return {VANS,FX};
}

function mod(x){const p=x.p||"";return p.startsWith("EASYPOS")?"EASYPOS":p.startsWith("토스 터미널")?"토스 터미널":p.startsWith("캐시노트페이")?"캐시노트페이":p.startsWith("무선단말기")?"무선단말기":p.startsWith("토스POS")?"토스POS":p.startsWith("업오더(아임유)")?"업오더(아임유)":p.startsWith("FirstPos ASP")?"FirstPos ASP":""}
function gtag(x){return x.v+" "+x.d+(mod(x)?" · "+mod(x):"")}
function gcard(a,q){const P=a.map(x=>x.p.split(" › "));let n=0;while(P.every(p=>p.length>n+1&&p[n]==P[0][n]))n++;
 const V=[];for(let j=0;j<20;j++)V[j]=new Set(P.map(p=>p[n+j])).size>1;const pre=P[0].slice(0,n),same=a.every(x=>x.o==a[0].o&&x.st==a[0].st&&x.nt==a[0].nt);
 let h='<div class="card gc"><div class="nm"><span class="tag">'+gtag(a[0])+'</span>'+hl(a[0].n,q)+' <span class="cnt">· '+a.length+'곳</span></div>';
 if(pre.length)h+='<div class="path">'+(pre.length>2?"… › ":"")+esc(pre.slice(-2).join(" › "))+' 아래</div>';
 if(same)h+=chips(a[0].o,a[0].st)+nte(a[0].nt)+kmb(a[0].n)+'<div class="nt2">선택지는 '+a.length+'곳이 같습니다. 해당하는 위치를 고르세요</div>';
 return h+a.map((x,i)=>{const r=P[i].slice(n);return '<div class="rw" data-k="'+key(x)+'"><div class="rl">'+r.map((t,j)=>V[j]?"<b>"+esc(t)+"</b>":'<span class="mu">'+esc(t)+"</span>").join(" › ")+(same?"":chips(x.o,x.st)+nte(x.nt))+'</div><span class="go2">자세히 ›</span></div>'}).join("")+'</div>'}
function gview(m,q,nc){const M=new Map();m.forEach(x=>{const k=x.v+"|"+x.d+"|"+mod(x)+"|"+x.n;if(!M.has(k))M.set(k,[]);M.get(k).push(x)});const L=[...M.values()];
 return '<div class="note">'+m.length+'건'+(L.length<m.length?" · 같은 이름은 묶어서 "+L.length+"개로 표시":"")+'</div>'+L.map(a=>a.length==1?card(a[0],q):gcard(a,q)).slice(0,nc?99:20).join("")+(!nc&&L.length>20?(MORE=L.slice(20).map(a=>a.length==1?card(a[0],q):gcard(a,q)).join(""),'<button class="back more">더 보기 ('+(L.length-20)+'개 더)</button>'):"")}

function exp(t){const E=new Set([t]);SYN.forEach(g=>{if(g.includes(t))g.forEach(x=>E.add(x));else g.forEach(m=>{if(m.length>=2&&t.length>m.length&&t.includes(m))g.forEach(m2=>{if(m2!=m)E.add(t.split(m).join(m2))})})});return[...E]}
function scr(nn,pp,rr,T,Q){let s=0;for(const E of T){let b=0;for(const e of E){const v=nn==e?14:nn.startsWith(e)?10:nn.includes(e)?8:pp.includes(e)?3:rr.includes(e)?2:0;if(v>b)b=v}if(!b)return 0;s+=b}return s+(Q&&nn.includes(Q)?10:0)}
function bg(e,h){if(e.length<3)return h.includes(e)?1:0;let c=0;for(let i=0;i<e.length-1;i++)if(h.includes(e.slice(i,i+2)))c++;return c/(e.length-1)}
function fzy(nn,T){let t=0,mn=1;for(const E of T){let b=0;for(const e of E){const v=nn.includes(e)?1:bg(e,nn);if(v>b)b=v}if(b<mn)mn=b;t+=b}return mn>=0.4?t/T.length:0}
let BIG="";function known(T){const k=T.filter(E=>E.some(e=>BIG.includes(e)));return k.length?k:T}
function tm(t,u){return u==t||(t.length>=2&&u.length>=2&&(u.startsWith(t)||t.startsWith(u)))}
function sugg(q){const qs=new Set(toks(q,true)),out=[],seen=new Set();
 for(const [ph,tg0] of ALIAS){if(!ph.some(p=>norm(q).includes(norm(p))||toks(p,true).every(t=>[...qs].some(u=>tm(t,u)))))continue;
  for(const t of tg0){flat.filter(x=>ok(x)&&mm(x)&&x.n.includes(t)).forEach(x=>{const k=mod(x)+x.d+x.n;if(!seen.has(k)&&out.length<4){seen.add(k);out.push(x)}})}}
 return out.length?'<div class="sg"><div class="lb2" style="margin:0 0 6px">💡 혹시 이거 찾으세요?</div><div class="quick" style="margin:0 0 6px">'+out.map(x=>'<button class="sgb" data-k="'+key(x)+'">'+esc(x.n)+' <small>'+dn(x)+'</small></button>').join("")+'</div></div>':""}
function search(){const q=$("q").value.trim(),r=$("res");$("home").style.display=q||mode=="fix"?"none":"";$("th").style.display=$("tree").style.display=mode=="fix"?"none":"";if(mode=="fix")return fixSearch(q,r);
 if(!q){r.innerHTML="";return}
 let Tk=toks(q);if(!Tk.length)Tk=toks(q,true);const T=known(Tk.map(exp)),Q=Tk.join("");
 const m=flat.filter(x=>ok(x)&&mm(x)).map(x=>({x,s:scr(x._n,x._p,x._r,T,Q)})).filter(o=>o.s>0).sort((a,b)=>b.s-a.s).map(o=>o.x);
 let F=[];if(m.length<3){const sm=new Set(m);F=flat.filter(x=>ok(x)&&mm(x)&&!sm.has(x)).map(x=>({x,s:fzy(x._n,T)})).filter(o=>o.s>=0.6).sort((a,b)=>b.s-a.s).slice(0,8).map(o=>o.x)}
 const nf=FX.filter(x=>ok(x)&&scr(x._n,x._p,x._r,T,Q)>0).length;
 let h=sugg(q);
 if(nf)h+='<div class="fxh">🛠 <b>문제 해결</b>에서 '+nf+'건 더 있어요 <button class="back fxb">보기</button></div>';
 if(m.length)h+=gview(m,q);
 if(F.length)h+='<div class="note" style="margin-top:14px">'+(m.length?"비슷한 항목도 보여드립니다":"일치하는 항목이 없어 비슷한 항목을 보여드립니다")+'</div>'+gview(F,q,1);
 r.innerHTML=h||'<div class="empty">검색 결과가 없습니다. VAN사·장비 필터를 확인하거나 다른 단어로 찾아보세요.</div>'}
const cnt=n=>n.items.length+n.ch.reduce((a,c)=>a+cnt(c),0);
function body(n){const E=[...n.items.map(it=>({k:parseInt(it[0]),o:it[5],it})),...n.ch.map(c=>({k:parseInt(c.name),o:c.o,c}))];
 if(E.every(e=>!isNaN(e.k)))E.sort((x,y)=>x.k-y.k);else E.sort((x,y)=>x.o-y.o);
 return E.map(e=>e.c?'<details class="sd"><summary>'+esc(e.c.name)+' <small>'+cnt(e.c)+'</small></summary>'+body(e.c)+'</details>':'<div class="row" data-k="'+e.it[4]+'"><div class="nm" style="font-size:15px">'+esc(e.it[0])+'</div>'+chips(e.it[1],e.it[3])+nte(e.it[2])+kmb(e.it[0])+'</div>').join("")}
function tree(){let t="";const fx=mode=="fix";$("th").style.display=fx?"none":"";$("quick").style.display=fx?"none":"";$("home").style.display=fx||$("q").value.trim()?"none":"";$("q").placeholder=fx?"증상 검색 (예: 출력 안 됨)":"예: 할부, 서명, 전표, 부가세";if(fx){$("tree").innerHTML="";return}
 Object.entries(VANS).forEach(([v,ds])=>{if(fv!="전체"&&v!=fv)return;
  Object.entries(ds).forEach(([d,gs])=>{if(fd!="전체"&&d!=fd)return;
   const root={items:[],ch:[]};let oc=0;
   gs.filter(g=>!fmod||g.p.startsWith(fmod)).forEach(g=>{let cur=root;g.p.split(" › ").forEach(p=>{let c=cur.ch.find(x=>x.name==p);if(!c){c={name:p,items:[],ch:[],o:oc++};cur.ch.push(c)}cur=c});g.i.forEach(i=>cur.items.push([i[0],i[1],i[2],g.t,encodeURIComponent([v,d,g.p,i[0]].join("|")),oc++]))});
   t+='<details><summary>'+v+' › '+d+' <small>'+cnt(root)+'</small></summary>'+(gs.length?body(root):'<div class="empty">내용 준비중</div>')+'</details>'})});
 $("tree").innerHTML=t}

const DEF=[["EASYPOS › 후불형 › 결제취소","결제취소시(반품)"],["EASYPOS › 후불형 › 재인쇄","영수증재발행"],["EASYPOS › 후불형 › 마감","영업마감"],["토스 터미널 › 결제내역/취소","직전 결제 보기"],["취소/정정","1.직전거래취소"]];
function hits(){try{return JSON.parse(localStorage.getItem(HK)||"{}")}catch(e){return{}}}
function rec(x){try{const h=hits(),k=key(x);h[k]=(h[k]||0)+1;localStorage.setItem(HK,JSON.stringify(h))}catch(e){}}
function al(x){return x.p.startsWith("EASYPOS")?"이지포스":x.v=="KICC"&&x.d=="단말기"?"이지체크":""}
function dn(x){if(!x.p)return x.m||(x.v+" "+x.d);return x.p.startsWith("EASYPOS")?"EASYPOS":x.p.startsWith("토스 터미널")?"토스 터미널":x.p.startsWith("캐시노트페이")?"캐시노트페이":x.p.startsWith("무선단말기")?"무선단말기":x.p.startsWith("토스POS")?"토스POS":x.p.startsWith("업오더(아임유)")?"업오더(아임유)":x.p.startsWith("FirstPos ASP")?"FirstPos ASP":x.v=="KICC"&&x.d=="단말기"?"이지체크":x.v+" "+x.d}
function fq(){const L=Object.entries(hits()).sort((a,b)=>b[1]-a[1]).map(e=>flat.find(x=>key(x)==e[0])).filter(Boolean).slice(0,5),auto=L.length;
 DEF.forEach(([p,n])=>{const x=flat.find(y=>y.p==p&&y.n==n);if(x&&!L.includes(x)&&L.length<6)L.push(x)});
 $("fq").innerHTML=L.map((x,i)=>'<button data-k="'+key(x)+'">'+(i<auto?"★ ":"")+esc(x.n)+' <small>'+dn(x)+'</small></button>').join("");$("fz").style.display=auto?"":"none"}
function devs(){const V={KICC:"var(--ac)",KPN:"var(--gn)",KIS:"var(--or)"};$("dev").innerHTML=Object.keys(V).map(v=>{const L=DEV.map((x,i)=>[x,i]).filter(([x])=>x.v==v);return '<div class="vb" style="--vc:'+V[v]+'"><div class="vh">'+v+' <small>VAN사</small></div><div class="tl">'+L.map(([x,i])=>'<div class="tile'+(fv==x.v&&fd==x.d&&fmod==(x.m||"")?" on":"")+'" data-i="'+i+'"><div class="ic">'+(x.img?'<img src="'+x.img+'" alt="">':x.i)+'</div><b>'+x.n+'</b><span>'+(x.lb||x.d)+(x.fx?" · 문제해결":"")+'</span></div>').join("")+'</div></div>'}).join("")}
$("fq").onclick=e=>{const b=e.target.closest("button");if(!b)return;const x=flat.find(y=>key(y)==b.dataset.k);if(x)showDetail(x)};
$("fz").onclick=()=>{try{localStorage.removeItem(HK)}catch(e){}fq()};
$("dev").onclick=e=>{const c=e.target.closest(".tile");if(!c)return;const x=DEV[c.dataset.i],same=fv==x.v&&fd==x.d&&fmod==(x.m||"");fv=same?"전체":x.v;fd=same?"전체":x.d;fmod=same?"":(x.m||"");if(x.fx&&!same)mode="fix";filt();search();tree();if(!same){const t=$("tree").querySelector("details");if(t)t.open=true;$("th").scrollIntoView({behavior:"smooth"})}};
function filt(){const f=(id,arr,cur,set)=>{$(id).innerHTML=arr.map(w=>'<button class="'+(w==cur?"on":"")+'">'+w+'</button>').join("");$(id).onclick=e=>{if(e.target.tagName=="BUTTON"){set(e.target.textContent);filt();search();tree()}}};
 f("fm",["메뉴 찾기","문제 해결"],mode=="fix"?"문제 해결":"메뉴 찾기",x=>mode=x=="문제 해결"?"fix":"menu");f("fv",["전체",...Object.keys(VANS)],fv,x=>{fv=x;fmod=""});f("fd",["전체",...DEVS],fd,x=>{fd=x;fmod=""});devs()}
$("q").addEventListener("input",search);
function showDetail(x){rec(x);$("home").style.display="none";$("th").style.display=$("tree").style.display="none";$("res").innerHTML='<button class="back">← 검색 결과로</button><div class="card big"><div class="nm"><span class="tag">'+tg(x)+'</span>'+esc(x.n)+'</div><div class="path">'+esc(x.p)+'</div>'+chips(x.o,x.st)+nte(x.nt)+kmb(x.n)+'</div>';window.scrollTo({top:0,behavior:"smooth"})}
$("res").onclick=e=>{const mo=e.target.closest(".more");if(mo){mo.outerHTML=MORE;return}if(e.target.closest(".fxb")){mode="fix";filt();search();tree();return}if(e.target.closest(".back")){search();return}const fc=e.target.closest(".card[data-f]");if(fc){showFix(FX[+fc.dataset.f]);return}const c=e.target.closest(".card[data-k],.rw[data-k],.sgb[data-k]");if(!c)return;const x=flat.find(y=>key(y)==c.dataset.k);if(x)showDetail(x)};
$("quick").innerHTML=QUICK.map(w=>'<button>'+w+'</button>').join("");
$("quick").onclick=e=>{if(e.target.tagName=="BUTTON"){$("q").value=e.target.textContent;search();window.scrollTo({top:0,behavior:"smooth"})}};
flat.forEach(x=>{x._n=norm(x.n);x._p=norm(x.p);x._r=norm(x.v+x.d+al(x)+x.nt+(x.o||"").replace(/\|/g," "))});
FX.forEach(x=>{x._n=norm(x.t);x._p=norm(x.c);x._r=norm(x.k+" "+x.i.map(i=>i.join(" ")).join(" ")+x.v+x.d+(x.m||""))});
BIG=flat.map(x=>x._n+x._p+x._r).join("|")+FX.map(x=>x._n+x._p+x._r).join("|");filt();tree();fq();

})();
