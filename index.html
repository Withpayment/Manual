const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hl(s,q){s=esc(s);if(!q)return s;const i=s.toLowerCase().indexOf(q.toLowerCase());return i<0?s:s.slice(0,i)+"<mark>"+s.slice(i,i+q.length)+"</mark>"+s.slice(i+q.length)}
const chips=(o,st)=>o&&(st||o.includes(">"))?'<div class="opt st">'+o.split(">").map(x=>"<span>"+esc(x.trim())+"</span>").join("<i>›</i>")+"</div>":o?'<div class="opt">'+o.split("|").map(x=>"<span>"+esc(x)+"</span>").join("")+"</div>":"";
const ok=x=>(fv=="전체"||x.v==fv)&&(fd=="전체"||x.d==fd);
function tg(x){const m=(x.p||"").match(/^(후불형|선불형|토스 터미널)/);return x.v+" "+x.d+(m?" · "+m[1]:"")}
function key(x){return encodeURIComponent([x.v,x.d,x.p,x.n].join("|"))}
function card(x,q){return '<div class="card" data-k="'+key(x)+'"><div class="nm"><span class="tag">'+tg(x)+'</span>'+hl(x.n,q)+'</div><div class="path">'+esc(x.p)+'</div>'+chips(x.o,x.st)+nte(x.nt)+'<div class="go">이 항목만 보기 ›</div></div>'}
function search(){const q=$("q").value.trim(),r=$("res");$("th").style.display=$("tree").style.display=mode=="fix"?"none":"";if(mode=="fix")return fixSearch(q,r);
 if(!q){r.innerHTML="";return}
 const k=norm(q),m=flat.filter(x=>ok(x)&&norm(x.n+x.p+x.nt+x.o.replace(/\|/g," ")).includes(k));
 r.innerHTML=m.length?'<div class="note">'+m.length+'건</div>'+m.map(x=>card(x,q)).join(""):'<div class="empty">검색 결과가 없습니다. VAN사·장비 필터를 확인하거나 다른 단어로 찾아보세요.</div>'}
const cnt=n=>n.items.length+n.ch.reduce((a,c)=>a+cnt(c),0);
function body(n){const E=[...n.items.map(it=>({k:parseInt(it[0]),it})),...n.ch.map(c=>({k:parseInt(c.name),c}))];
 if(E.every(e=>!isNaN(e.k)))E.sort((x,y)=>x.k-y.k);else E.sort((x,y)=>(!!x.c)-(!!y.c));
 return E.map(e=>e.c?'<details class="sd"><summary>'+esc(e.c.name)+' <small>'+cnt(e.c)+'</small></summary>'+body(e.c)+'</details>':'<div class="row" data-k="'+e.it[4]+'"><div class="nm" style="font-size:15px">'+esc(e.it[0])+'</div>'+chips(e.it[1],e.it[3])+nte(e.it[2])+'</div>').join("")}
function tree(){let t="";const fx=mode=="fix";$("th").style.display=fx?"none":"";$("quick").style.display=fx?"none":"";$("q").placeholder=fx?"증상 검색 (예: 출력 안 됨)":"예: 할부, 서명, 전표, 부가세";if(fx){$("tree").innerHTML="";return}
 Object.entries(VANS).forEach(([v,ds])=>{if(fv!="전체"&&v!=fv)return;
  Object.entries(ds).forEach(([d,gs])=>{if(fd!="전체"&&d!=fd)return;
   const root={items:[],ch:[]};
   gs.forEach(g=>{let cur=root;g.p.split(" › ").forEach(p=>{let c=cur.ch.find(x=>x.name==p);if(!c){c={name:p,items:[],ch:[]};cur.ch.push(c)}cur=c});g.i.forEach(i=>cur.items.push([i[0],i[1],i[2],g.t,encodeURIComponent([v,d,g.p,i[0]].join("|"))]))});
   t+='<details><summary>'+v+' › '+d+' <small>'+cnt(root)+'</small></summary>'+(gs.length?body(root):'<div class="empty">내용 준비중</div>')+'</details>'})});
 $("tree").innerHTML=t}
const FX=[
{v:"KICC",d:"POS",t:"배달의민족 같이 쓰면 영수증이 출력되지 않음",k:"출력 안됨 프린터 배달앱 배민 영수증",c:"KICC 단말기가 리더기 겸용으로 설정되어 있음. 프린터용으로만 설정하면 출력됨",i:[["전제조건","POS에 리더기·싸인패드를 시리얼로 연결","싸인패드가 단말기에 연결되어 있으면 안 됨"],["방법1-① 이지체크 단말기","특수>2.부가장치>2.POS>POS속도설정>동작모드: 1.단말기","POS·키오스크 같이 사용해도 된다고 함"],["방법1-② 싸인패드","Y자 케이블로 POS에 시리얼 방식으로 직접 연결"],["방법1-③ 이지포스 프린터","환경설정>장비설정>프린터>프린터종류: 도시바","도시바로 설정하면 단말기를 나중에 리더기로 바꿔도 단말기가 반응 없음"],["방법1-④ 이지포스 싸인패드","환경설정>장비설정>싸인패드>시리얼제어(단말기 연동 X)"],["방법1-⑤ 주방프린터 배달출력","환경설정>장비설정>주방프린터>점유안함"],["방법2","배달 전용으로 별도 프린터 설치"]]}
];
let mode="menu";
function fixSearch(q,r){const k=norm(q);
 const m=FX.filter(x=>ok(x)&&(!k||norm(x.t+x.k+x.c+x.i.map(i=>i.join(" ")).join(" ")).includes(k)));
 r.innerHTML=m.length?'<div class="note">'+m.length+'건</div>'+m.map(x=>'<div class="card"><div class="nm"><span class="tag">'+tg(x)+'</span>'+hl(x.t,q)+'</div><div class="path">원인: '+esc(x.c)+'</div>'+x.i.map(([n,o,nt])=>'<div class="row"><div class="nm" style="font-size:15px">'+esc(n)+'</div>'+chips(o,1)+nte(nt)+'</div>').join("")+'</div>').join(""):'<div class="empty">해당하는 문제 해결 항목이 없습니다. 필터를 확인하거나 다른 단어로 찾아보세요.</div>'}
function filt(){const f=(id,arr,cur,set)=>{$(id).innerHTML=arr.map(w=>'<button class="'+(w==cur?"on":"")+'">'+w+'</button>').join("");$(id).onclick=e=>{if(e.target.tagName=="BUTTON"){set(e.target.textContent);filt();search();tree()}}};
 f("fm",["메뉴 찾기","문제 해결"],mode=="fix"?"문제 해결":"메뉴 찾기",x=>mode=x=="문제 해결"?"fix":"menu");f("fv",["전체",...Object.keys(VANS)],fv,x=>fv=x);f("fd",["전체","POS","단말기"],fd,x=>fd=x)}
$("q").addEventListener("input",search);
$("res").onclick=e=>{if(e.target.closest(".back")){search();return}const c=e.target.closest(".card[data-k]");if(!c)return;const x=flat.find(y=>key(y)==c.dataset.k);if(!x)return;$("th").style.display=$("tree").style.display="none";$("res").innerHTML='<button class="back">← 검색 결과로</button><div class="card big"><div class="nm"><span class="tag">'+tg(x)+'</span>'+esc(x.n)+'</div><div class="path">'+esc(x.p)+'</div>'+chips(x.o,x.st)+nte(x.nt)+'</div>';window.scrollTo({top:0,behavior:"smooth"})};
$("quick").innerHTML=QUICK.map(w=>'<button>'+w+'</button>').join("");
$("quick").onclick=e=>{if(e.target.tagName=="BUTTON"){$("q").value=e.target.textContent;search();window.scrollTo({top:0,behavior:"smooth"})}};
filt();tree();
</script></body></html>
